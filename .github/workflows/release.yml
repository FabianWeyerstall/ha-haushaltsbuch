name: Release

# Creates a GitHub release whenever the version in manifest.json changes on
# main, so HACS shows real version numbers and an update button.

on:
  push:
    branches: [main]
    paths:
      - custom_components/haushaltsbuch/manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # all tags, to find out whether a restart is needed
      - name: Read version
        id: version
        run: echo "version=$(jq -r .version custom_components/haushaltsbuch/manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            # Versions like 0.10.0b1 become pre-releases; HACS shows them with "Show beta versions".
            PRE=""
            case "$TAG" in *a[0-9]*|*b[0-9]*|*rc[0-9]*) PRE="--prerelease" ;; esac
            # CHANGELOG.md section + restart hint from the changed files (scripts/release_notes.py).
            python3 scripts/release_notes.py "${TAG#v}" > notes.md
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" $PRE --notes-file notes.md
          fi
